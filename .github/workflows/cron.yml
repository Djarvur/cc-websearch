name: Periodic Checks

on:
  schedule:
    - cron: '0 6 * * 1' # Monday 6 AM UTC
  workflow_dispatch: # Allow manual trigger

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm audit --audit-level=critical
      - run: npm run build
      # e2e spawns the local `claude` CLI, which is not installed on
      # GitHub-hosted runners; skip (with a warning) when it is missing.
      - name: Run e2e (skipped if claude CLI is unavailable)
        run: |
          if ! command -v claude >/dev/null 2>&1; then
            echo "::warning::claude CLI not found on runner — skipping e2e (runs locally only)"
            exit 0
          fi
          npm run e2e
        timeout-minutes: 10
