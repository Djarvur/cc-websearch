name: Periodic Checks

on:
  schedule:
    - cron: '0 6 * * 1' # Monday 6 AM UTC
  workflow_dispatch: # Allow manual trigger

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # jsdom 30 requires ^22.22.2 || ^24.15.0 || >=26.0.0 (node 20 is EOL
          # and breaks with `webidl.util.markAsUncloneable is not a function`).
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npm audit --audit-level=critical
      - run: npm run build
      # e2e spawns the local `claude` CLI, which is not installed on
      # GitHub-hosted runners; skip (with a warning) when it is missing.
      - name: Run e2e (skipped if claude CLI is unavailable)
        run: |
          if ! command -v claude >/dev/null 2>&1; then
            echo "::warning::claude CLI not found on runner — skipping e2e (runs locally only)"
            exit 0
          fi
          npm run e2e
        timeout-minutes: 10
