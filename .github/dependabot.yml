version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
      include: scope
    labels:
      - dependencies
      - javascript
    # typescript-eslint peers require typescript <6.1.0; TS 7 is not
    # supported yet, so a bump to 7.x breaks `npm ci` (ERESOLVE).
    # Re-enable once typescript-eslint supports TS 7.
    ignore:
      - dependency-name: typescript
        versions:
          - '>=7.0.0'
    groups:
      all-npm-deps:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
      - github-actions
    groups:
      all-github-actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
